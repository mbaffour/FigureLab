name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Active LTS. Node 20 reached end of life on 2026-04-30, so the suite was
          # running on an unsupported runtime; this is separate from the runner's
          # deprecation warning, which was about the actions' own node20 runtime.
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
